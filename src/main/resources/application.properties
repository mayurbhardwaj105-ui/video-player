spring.application.name=streamvault

# --- MySQL (stores only video metadata, not the files) ---
spring.datasource.url=jdbc:mysql://localhost:3306/streamvault_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Cloudinary ---
# Get these from https://console.cloudinary.com/ dashboard
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# Allow larger uploads for video files
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

server.port=8081
